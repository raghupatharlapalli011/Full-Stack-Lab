<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Dynamic To-Do List</title>
    <style>
        /* Save this as styles.css */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    display: flex;
    justify-content: center;
    padding-top: 50px;
}

.todo-container {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    width: 300px;
}

.input-section {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    flex: 1;
    padding: 8px;
}

button {
    padding: 8px 12px;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #eee;
    margin-bottom: 10px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* We'll use this class in JS to mark tasks as done */
.completed {
    text-decoration: line-through;
    color: gray;
}
    </style>
</head>
<body>

    <div class="todo-container">
        <h1>My Tasks</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add</button>
        </div>

        <ul id="taskList">
            <!-- JavaScript will add list items (<li>) here -->
        </ul>
    </div>

   <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');

    // The entire process must happen INSIDE this click listener
    addTaskBtn.addEventListener('click', () => {
        const tasktext = taskInput.value;
        
        // 1. Check if empty
        if(tasktext === ""){
            alert('add the any task to start');
            return;
        }

        // 2. Create the elements
        const li = document.createElement('li'); 
        const span = document.createElement('span'); 
        const completeBtn = document.createElement('button');
        const deleteBtn = document.createElement('button');

        // 3. Populate text and styles
        span.textContent = tasktext;

        completeBtn.textContent = "Complete";
        completeBtn.style.background = "rgb(112, 224, 0)";
        completeBtn.style.marginRight = "10px"; // Added a little gap

        deleteBtn.textContent = "Delete";
        deleteBtn.style.background = "#dc3545"; 

        // 4. Add functionality to buttons
        completeBtn.addEventListener('click', () => {
            span.style.textDecoration = "line-through";
            span.style.color = "gray";
        });

        deleteBtn.addEventListener('click', () => {
            li.remove(); 
        });

        // 5. Assemble the pieces
        // To make it look nice side-by-side, let's wrap the buttons in a div
        const buttonGroup = document.createElement('div');
        buttonGroup.appendChild(completeBtn);
        buttonGroup.appendChild(deleteBtn);

        li.appendChild(span);
        li.appendChild(buttonGroup); // Append the grouped buttons

        // 6. FIX: Add the finished <li> to the actual webpage!
        taskList.appendChild(li);

        // 7. BONUS FIX: Clear the input box so the user can type the next task
        taskInput.value = "";
        
    }); 
</script>
</body>
</html>
