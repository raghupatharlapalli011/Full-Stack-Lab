<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Styled Webpage</title>
    <style>
        /* Adding a simple border so you can easily see the canvas area */
        canvas {
            border: 2px solid #333;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>My Styled Webpage</h1>
    <p>HTML5 Canvas Drawing Below:</p>

    <!-- HTML5 Canvas Element -->
    <canvas id="myCanvas" width="500" height="400">
        Your browser does not support the HTML5 canvas tag.
    </canvas>

    <script>
        // 1. Setup: Get the canvas element and its 2D drawing context
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");

        // 2. Draw a Rectangle
        ctx.fillStyle = "#3498db"; // Set fill color to blue
        ctx.fillRect(30, 30, 150, 100); // (x, y, width, height)

        // 3. Draw a Circle
        ctx.beginPath();
        // arc(x, y, radius, startAngle, endAngle)
        ctx.arc(350, 80, 50, 0, 2 * Math.PI); 
        ctx.fillStyle = "#e74c3c"; // Set fill color to red
        ctx.fill(); // Fill the circle
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#c0392b"; // Darker red border
        ctx.stroke(); // Draw the border

        // 4. Draw a Line
        ctx.beginPath();
        ctx.moveTo(30, 200); // Starting point of the line (x, y)
        ctx.lineTo(470, 200); // Ending point of the line (x, y)
        ctx.lineWidth = 5; // Line thickness
        ctx.strokeStyle = "#2ecc71"; // Set line color to green
        ctx.stroke(); // Actually draw the line

        // 5. Display Text (Your Name)
        ctx.font = "30px Arial"; // Set font size and family
        ctx.fillStyle = "#2c3e50"; // Set text color to dark grey
        // Change "Your Name" to your actual name!
        ctx.fillText("RAGHU", 170, 300); // (text, x, y)
    </script>

</body>
</html>
