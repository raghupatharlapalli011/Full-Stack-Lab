<!DOCTYPE html>
<html>

<head>
  <title>Dynamic Web Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      color: #222;
    }

    header {
      background: #1e293b;
      color: white;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    input {
      padding: 8px;
      width: 60%;
      margin-right: 8px;
    }

    button {
      padding: 8px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #clock {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
      color: #2563eb;
    }

    li {
      margin: 6px 0;
      padding: 6px;
      background: #f1f5f9;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dynamic Web Application</h1>
    <p>Interactive DOM Operations</p>
  </header>

  <div class="box">
    <h3>Student Greeting</h3>
    <input id="userName" placeholder="Enter your name">
    <button onclick="greetUser()">Greet</button>
    <p id="greetMsg" style="margin-top: 10px; font-weight: bold;"></p>
  </div>

  <div class="box">
    <h3>Digital Clock</h3>
    <div id="clock">00:00:00</div>
  </div>

  <div class="box">
    <h3>Task List</h3>
    <input id="taskInput" placeholder="Add new task">
    <button onclick="addNewTask()">Add Task</button>
    <ul id="taskContainer" style="margin-top: 10px; list-style: none;"></ul>
  </div>

  <div class="box">
    <h3>Theme Switcher</h3>
    <button onclick="setTheme('#f4f7fb', '#222')">Light</button>
    <button onclick="setTheme('#0f172a', '#f8fafc')">Dark</button>
    <button onclick="setTheme('#ecfdf5', '#064e3b')">Emerald</button>
  </div>

  <script>
    function greetUser() {
      const name = document.getElementById('userName').value;
      document.getElementById('greetMsg').textContent = name ? "Hello, " + name + "! Welcome to ANITS." : "";
    }

    function showTime() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(showTime, 1000);
    showTime();

    function addNewTask() {
      const val = document.getElementById('taskInput').value.trim();
      if (val) {
        const li = document.createElement('li');
        li.textContent = val;
        document.getElementById('taskContainer').appendChild(li);
        document.getElementById('taskInput').value = '';
      }
    }

    function setTheme(bg, color) {
      document.body.style.background = bg;
      document.body.style.color = color;
    }
  </script>

</body>

</html>
